# This file is ONLY for Testing cases.
# NEVER use this in a production environment!
networks:
  test_net:
    ipam:
      config:
        - subnet: 10.10.10.0/24
          gateway: 10.10.10.10
services:
  nginx:
    # This could change depending on the base image used for testing.
    # build: ../debian
    build: ../alpine
    container_name: nginx
    restart: never
    ports:
      - "8081:8081" # HTTP 
    expose:
     - "8081"
    volumes:
      - ./crowdsec-nginx-bouncer.conf:/etc/crowdsec/bouncers/crowdsec-nginx-bouncer.conf:Z,ro
      - ./logs:/var/log/nginx:z,rw
      - ./nginx.conf:/etc/nginx/nginx.conf:Z,ro
    networks:
      - test_net
  crowdsec:
    image: crowdsecurity/crowdsec
    container_name: crowdsec
    restart: never
    ports:
      - "8080:8080"
    expose:
     - "8080"
    volumes:
      - ./acquis.yaml:/etc/crowdsec/acquis.yaml:Z,ro
      - ./logs:/var/log/nginx:z,ro
      - ./profiles.yaml:/etc/crowdsec/profiles.yaml:Z,ro
    environment:
      - CROWDSEC_BYPASS_DB_VOLUME_CHECK=true
      - BOUNCER_KEY_nginx_bouncer="key"
    networks:
      - test_net