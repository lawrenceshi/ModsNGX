# This file is ONLY for Testing cases.
# NEVER use this in a production environment!
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

load_module modules/ndk_http_module.so;
load_module modules/ngx_http_lua_module.so;
load_module modules/ngx_http_headers_more_filter_module.so;
load_module modules/ngx_http_coraza_module.so;



events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    # Use for docker
    #resolver 127.0.0.11 valid=30s;
    # Use for podman
    resolver 10.89.0.1 valid=30s;

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
    lua_package_path "/opt/nginx/lib/lua/?.lua;/opt/nginx/lib/lua/?/init.lua;/usr/local/lua/crowdsec/?.lua;;";
    # Example from https://github.com/openresty/lua-nginx-module#synopsis, edited
 server {
    listen 8081;
     location /test/lua_content {
         # MIME type determined by default_type:
         default_type 'text/plain';

         content_by_lua_block {
            ngx.say('Hello,world!')
         }
     }

     location /test/lua_plugins {
         # MIME type determined by default_type:
         default_type 'text/plain';

         content_by_lua_block {
            local http = require("resty.http")
            local cjson = require("cjson")
            ngx.say('Hello, plugins!')
            ngx.say('See console for more information.')
         }
     }

     location /test/head_change_zone {
         # MIME type determined by default_type:
         default_type 'text/plain';       
         more_set_headers    "X-test: Hello, world!";
        content_by_lua_block {
             ngx.say('Hello, head changer!')
         }
     }


     location /test/coraza_protect_zone {
         # MIME type determined by default_type:
         default_type 'text/plain';       
         coraza on;
         coraza_rules '
          SecRuleEngine On
          SecDebugLog /tmp/coraza_debug.log
          SecDebugLogLevel 9
          SecRuleRemoveById 10
          
          SecRule REQUEST_URI "@contains 403" "id:1001,phase:1,deny,status:403,msg:\"Path contains 403\""
        ';
        content_by_lua_block {
             ngx.say('Hello, coraza!')
         }
     }




     location / {
        client_max_body_size 100k;
        client_body_buffer_size 100k;

        # access_by_lua_block {
