# This file is ONLY for Testing cases.
# NEVER use this in a production environment!
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

load_module modules/ndk_http_module.so;
load_module modules/ngx_http_acme_module.so;
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;
load_module modules/ngx_http_coraza_module.so;
load_module modules/ngx_http_fancyindex_module.so;
load_module modules/ngx_http_geoip_module.so;
load_module modules/ngx_http_headers_more_filter_module.so;
load_module modules/ngx_http_image_filter_module.so;
load_module modules/ngx_http_js_module.so;
load_module modules/ngx_http_lua_module.so;
load_module modules/ngx_http_xslt_filter_module.so;
load_module modules/ngx_http_zstd_filter_module.so;
load_module modules/ngx_http_zstd_static_module.so;
load_module modules/ngx_rtmp_module.so;
load_module modules/ngx_stream_geoip2_module.so;
load_module modules/ngx_stream_geoip_module.so;
load_module modules/ngx_stream_js_module.so;
load_module modules/ngx_http_lua_upstream_module.so;  


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    # Use for docker
    # resolver 127.0.0.11 valid=30s;
    # Use for podman
    resolver 10.10.10.10 valid=30s;

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
    lua_package_path "${LUA_MODULE_PATH}/lib/lua/${LUA_VERSION}/?.lua;${LUA_MODULE_PATH}/lib/lua/${LUA_VERSION}/?/init.lua;${CROWDSEC_LIB_PATH}/?.lua;;";
    # Example from https://github.com/openresty/lua-nginx-module#synopsis, edited
    server {
        listen       ${NGINX_PORT};

        brotli on;
        brotli_types text/plain;
        brotli_min_length 1;

        location /test/lua_content {
            # MIME type determined by default_type:
            default_type 'text/plain';

            content_by_lua_block {
                ngx.say('Hello, world!')
            }
        }

        location /test/lua_plugins {
            # MIME type determined by default_type:
            default_type 'text/plain';

            content_by_lua_block {

                require("resty.core")
                require("resty.lrucache")
                require("resty.lock")
                require("resty.limit.traffic")
                require("resty.redis")
                require("resty.cookie")
                require("resty.upstream.healthcheck")
                require("resty.http")
                require("resty.string")
                require("resty.openssl")
                require("resty.session.redis")
                require("resty.jwt")

                require("cjson")

                ngx.say('Hello, plugins!')
                ngx.say('See console for more information.')
            }
        }

        location /test/header_change_zone {
            # MIME type determined by default_type:
            default_type 'text/plain';       
            more_set_headers    "X-test: Hello, world!";
            more_set_headers "Refresh: 0; url=https://www.youtube.com/watch?v=cE0wfjsybIQ" ;
            content_by_lua_block {
                ngx.say('Hello, header changer!')
            }
        }


        location /test/coraza_protect_zone {
            # MIME type determined by default_type:
            default_type 'text/plain';       
            coraza on;
            coraza_rules '
            SecRuleEngine On
            SecDebugLog /tmp/coraza_debug.log
            SecDebugLogLevel 9
            SecRuleRemoveById 10
            
            SecRule REQUEST_URI "@contains 403" "id:1001,phase:1,deny,status:403,msg:\"Path contains 403\""
            ';
            content_by_lua_block {
                ngx.say('Hello, coraza!')
            }
        }

        location /test/files/ {
            alias /;
            fancyindex on;
#            autoindex on;
        }

        

        location / {
            client_max_body_size 100k;
            client_body_buffer_size 100k;

            # access_by_lua_block {
            #     -- check the client IP address is in our black list
            #     if ngx.var.remote_addr == "132.5.72.3" then
            #         ngx.exit(ngx.HTTP_FORBIDDEN)
            #     end

            #     -- check if the URI contains bad words
            #     if ngx.var.uri and
            #            string.match(ngx.var.request_body, "evil")
            #     then
            #         return ngx.redirect("/terms_of_use.html")
            #     end

            #     -- tests passed
            # }

            # proxy_pass/fastcgi_pass/etc settings
        }
    }
}
